<!doctype html>
<!-- The picture shown when a link to the site is shared (1200x630, Open Graph / X / WhatsApp).
     Rendered by tools/social/build.cjs from the site's own logo, fonts, photo and background. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Montserrat; font-weight: 500; src: url(../../public/assets/fonts/montserrat-500.woff2); }
  @font-face { font-family: Montserrat; font-weight: 700; src: url(../../public/assets/fonts/montserrat-700.woff2); }
  @font-face { font-family: Montserrat; font-weight: 900; src: url(../../public/assets/fonts/montserrat-900.woff2); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: Montserrat; color: #FDFDFD;
    background:
      linear-gradient(90deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.72) 55%, rgba(0,0,0,.35) 100%),
      #000 url(../../public/assets/img/particles-1280.webp) center / cover no-repeat;
  }
  .copy { position: absolute; left: 80px; top: 78px; width: 640px; }
  .logo { width: 330px; display: block; }
  h1 { margin-top: 44px; font-weight: 900; font-size: 66px; line-height: 1.02; letter-spacing: .06em; text-transform: uppercase; }
  .tag { margin-top: 26px; font-weight: 700; font-size: 30px; color: #F715AB; }
  .who { margin-top: 10px; font-weight: 500; font-size: 22px; color: rgba(253,253,253,.8); }
  .photo { position: absolute; right: 60px; bottom: 0; height: 600px; }
  .rule { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #BF00FF; }
</style></head>
<body>
  <div class="copy">
    <img class="logo" src="../../public/assets/img/logo/fit-logo-white-hd.svg" alt="">
    <h1>Move. Grow.<br>Work.</h1>
    <p class="tag">Focus on the feeling.</p>
    <p class="who">by Faye Edwards</p>
  </div>
  <img class="photo" src="../../public/assets/img/faye-white-cutout-full-755.webp" alt="">
  <div class="rule"></div>
</body></html>
